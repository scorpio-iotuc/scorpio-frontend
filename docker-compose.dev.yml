services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: scorpio-frontend:dev
    restart: unless-stopped
    ports:
      - "${PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
    develop:
      watch:
        # Sync source changes; Vite handles HMR
        - action: sync 
          path: .
          target: /app
          ignore:
            - node_modules/
            - .git/
            - dist/
            - Dockerfile.dev

        # Rebuild when dependencies change
        - action: rebuild
          path: package.json

        - action: rebuild
          path: package-lock.json

        # Rebuild if the development image configuration changes
        - action: rebuild
          path: Dockerfile.dev


networks:
  scorpio-net:
    external: true
    name: scorpio-net
