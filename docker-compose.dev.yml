services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: scorpio-frontend:dev
    restart: unless-stopped
    ports:
      - "${PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules

networks:
  scorpio-net:
    external: true
    name: scorpio-net
